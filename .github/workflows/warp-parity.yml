name: warp parity

on:
  workflow_dispatch:
    inputs:
      edge:
        description: "Cloudflare MASQUE edge, host:port (blank = 162.159.198.2:443)"
        required: false
        type: string
      target_url:
        description: "Public file downloaded through WARP (blank = speed.cloudflare.com 64 MiB)"
        required: false
        type: string
      repeats:
        description: "Paired repeats per engine; nested cells use 3"
        required: false
        default: "3"
        type: string
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: warp-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  warp-parity:
    name: same-key WARP parity
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: upstream/pins.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: warp-parity
      - name: build the engine and the harness
        run: cargo build --locked --release -p ferrox-app -p ferrox-bench
      - name: build the reference
        run: |
          set -euo pipefail
          rev="$(python3 -c 'import tomllib; print(tomllib.load(open("upstream/pins.toml", "rb"))["sources"]["aether"]["rev"])')"
          test -n "$rev"
          curl -sSLf -o "$RUNNER_TEMP/aether.tgz" "https://github.com/CluvexStudio/Aether/archive/$rev.tar.gz"
          mkdir -p upstream/aether
          tar -xzf "$RUNNER_TEMP/aether.tgz" --strip-components=1 -C upstream/aether
          (cd upstream/aether/aether && env -u CARGO_ENCODED_RUSTFLAGS cargo build --locked --release --bin aether)
      - name: registration, same-key local and Cloudflare runs
        env:
          WARP_MASQUE_EDGE: ${{ inputs.edge }}
          WARP_PARITY_URL: ${{ inputs.target_url }}
          REPEATS: ${{ inputs.repeats || '3' }}
        run: |
          [[ "$REPEATS" =~ ^0*[1-9][0-9]*$ ]] || { echo "::error::repeats must be a positive integer, got '$REPEATS'"; exit 1; }
          args=(--aether upstream/aether/aether/target/release/aether
                --repeats "$REPEATS")
          if test -n "${WARP_MASQUE_EDGE:-}"; then args+=(--edge "$WARP_MASQUE_EDGE"); fi
          if test -n "${WARP_PARITY_URL:-}"; then args+=(--target-url "$WARP_PARITY_URL"); fi
          python3 scripts/run-warp-parity.py "${args[@]}"
      - name: local nested WARP cells
        if: always()
        env:
          AETHER_BIN: ${{ github.workspace }}/upstream/aether/aether/target/release/aether
          FERROX_UPSTREAM_HANDOFF: "1"
        run: |
          mkdir -p target/warp-parity
          cp scripts/run-aether.py target/warp-parity/aether-adapter
          chmod +x target/warp-parity/aether-adapter
          ./scripts/run-benchmark-matrix.sh \
            --tier standard \
            --out target/warp-parity/local-nested \
            --engines "xray-core,ferrox,aether=$PWD/target/warp-parity/aether-adapter" \
            --only warp-masque \
            --only warp-gool \
            --only warp-mim \
            --repeats 3 \
            --no-build \
            --bench-bin target/release/ferrox-bench
      - name: publish the report
        if: always()
        run: |
          {
            echo
            echo '```'
            cat target/warp-parity/report.md 2>/dev/null || echo "no report"
            echo '```'
            if test -f target/warp-parity/local-nested/summary.txt; then
              echo
              echo '```'
              cat target/warp-parity/local-nested/summary.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warp-parity-${{ github.run_id }}
          path: |
            target/warp-parity/report.md
            target/warp-parity/results.json
            target/warp-parity/local-nested/
            target/warp-parity/logs/
            target/warp-parity/runs/**/logs/
          retention-days: 30
          if-no-files-found: warn

  cli-warp:
    name: CLI direct and chained WARP
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: warp-parity
      - name: build the engine
        run: cargo build --locked --release -p ferrox-app
      - name: WARP registration edge
        run: |
          set -euo pipefail
          target/release/ferrox-app warp-register --mode wireguard -o "$RUNNER_TEMP/warp-wireguard-identity.json"
          target/release/ferrox-app warp-register --mode auto -o "$RUNNER_TEMP/warp-identity.json"
          target/release/ferrox-app warp-register --mode gool -o "$RUNNER_TEMP/warp-gool-identity.json"
          for identity in "$RUNNER_TEMP"/warp*-identity*.json; do
            python3 -c 'import json,sys; i=json.load(open(sys.argv[1])); print(sys.argv[1], "wireguard edge:", i.get("wireguard",{}).get("endpoint")); print(sys.argv[1], "masque key:", bool(i.get("masque",{}).get("privateKey")))' "$identity"
          done
      - name: direct and nested WARP through the CLI
        env:
          FERROX_BIN: ${{ github.workspace }}/target/release/ferrox-app
          FERROX_PROFILE: release
          FERROX_CONF_DIR: ${{ runner.temp }}/cli-warp/conf
          FERROX_STATE_DIR: ${{ runner.temp }}/cli-warp/state
        run: |
          set -euo pipefail
          mkdir -p "$FERROX_CONF_DIR" "$FERROX_STATE_DIR"
          trap 'dist/ferrox-cli.sh down --all >/dev/null 2>&1 || true' EXIT
          failed=0
          run_lane() {
            local label="$1"; shift
            local want="${LANE_WARP:-on}"
            local identity="$RUNNER_TEMP/warp-identity.json"
            if [ "${1:-}" = "--identity" ]; then
              identity="$2"; shift 2
            fi
            local port trace
            port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
            echo "::group::$label"
            if ! dist/ferrox-cli.sh up --fronts socks --socks "$port" \
              --warp-identity "$identity" "$@"; then
              echo "::error::$label did not start"
              failed=1
              dist/ferrox-cli.sh down || true
              echo "::endgroup::"
              return 0
            fi
            if ! trace="$(curl -fsS --noproxy '' --max-time 60 --retry 3 --socks5-hostname "127.0.0.1:$port" https://www.cloudflare.com/cdn-cgi/trace)"; then
              echo "::error::$label did not carry the trace through WARP"
              failed=1
            else
              printf '%s\n' "$trace"
              printf '%s\n' "$trace" | grep -qx "warp=$want" || {
                echo "::error::$label did not egress with warp=$want"
                failed=1
              }
            fi
            dist/ferrox-cli.sh down || true
            echo "::endgroup::"
          }
          run_lane "direct WireGuard" --identity "$RUNNER_TEMP/warp-wireguard-identity.json" --warp --warp-mode wireguard
          run_lane "direct MASQUE" --warp --warp-mode masque
          run_lane "direct auto" --warp
          run_lane "direct WireGuard over MASQUE" --identity "$RUNNER_TEMP/warp-gool-identity.json" --warp --warp-mode gool
          run_lane "nested WireGuard" --identity "$RUNNER_TEMP/warp-wireguard-identity.json" --warp --warp-mode gool-classic
          run_lane "nested MASQUE" --warp --warp-mode mim
          LANE_WARP=off run_lane "Veepn through WireGuard" --identity "$RUNNER_TEMP/warp-wireguard-identity.json" --veepn --warp --warp-mode wireguard
          LANE_WARP=off run_lane "Veepn through MASQUE" --veepn --warp --warp-mode masque
          LANE_WARP=off run_lane "Veepn through auto" --veepn --warp
          LANE_WARP=off run_lane "Veepn through WireGuard over MASQUE" --identity "$RUNNER_TEMP/warp-gool-identity.json" --veepn --warp --warp-mode gool
          LANE_WARP=off run_lane "Veepn through nested WireGuard" --identity "$RUNNER_TEMP/warp-wireguard-identity.json" --veepn --warp --warp-mode gool-classic
          LANE_WARP=off run_lane "Veepn through nested MASQUE" --veepn --warp --warp-mode mim
          test "$failed" = 0
      - name: sudo keeps the lane in the invoking users files
        run: |
          set -euo pipefail
          sudo env FOXY_PASS=probe "$PWD/dist/ferrox-cli.sh" --help >/dev/null
          root_state="$RUNNER_TEMP/cli-warp-root"
          rm -rf "$root_state"
          mkdir -p "$root_state/conf" "$root_state/state"
          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          sudo env FERROX_CONF_DIR="$root_state/conf" FERROX_STATE_DIR="$root_state/state" \
            FERROX_BIN="$PWD/target/release/ferrox-app" \
            "$PWD/dist/ferrox-cli.sh" up --vpn --fronts socks --socks "$port" \
            --warp --warp-mode masque --warp-identity "$RUNNER_TEMP/warp-identity.json"
          trace="$(curl -fsS --noproxy '' --max-time 60 --retry 3 --socks5-hostname "127.0.0.1:$port" https://www.cloudflare.com/cdn-cgi/trace)"
          printf '%s\n' "$trace"
          printf '%s\n' "$trace" | grep -qx 'warp=on'
          sudo env FERROX_CONF_DIR="$root_state/conf" FERROX_STATE_DIR="$root_state/state" \
            FERROX_BIN="$PWD/target/release/ferrox-app" \
            "$PWD/dist/ferrox-cli.sh" down
          if find "$root_state" -user root -print -quit | grep -q .; then
            echo "::error::a sudo lane left root-owned files under $root_state"
            find "$root_state" -user root -ls
            exit 1
          fi

  result:
    name: result
    needs: [warp-parity, cli-warp]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/result
        with:
          title: warp-parity
          needs: ${{ toJSON(needs) }}
          artifacts: warp-parity-*
