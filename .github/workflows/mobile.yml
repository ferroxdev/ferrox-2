name: mobile

on:
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: android aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: mobile
          cache-on-failure: true
          cache-targets: false
      - name: point the cross build at the NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          test -n "$ndk"
          clang="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          test -x "$clang"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=${clang%clang}clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CLANG_PATH=$clang" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--target=aarch64-linux-android24" >> "$GITHUB_ENV"
          echo "CMAKE_TOOLCHAIN_FILE_aarch64_linux_android=$ndk/build/cmake/android.toolchain.cmake" >> "$GITHUB_ENV"
      - name: compile the app for a VpnService host
        run: cargo check --locked -p ferrox-app --target aarch64-linux-android

  ios:
    name: ios aarch64
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: mobile
          cache-on-failure: true
          cache-targets: false
      - name: compile the app for a utun host
        run: cargo check --locked -p ferrox-app --target aarch64-apple-ios
